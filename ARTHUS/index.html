{id:'security',name:['스마일보안시스템','Smile Security System'],category:['SECURITY & ACCESS','SECURITY & ACCESS'],tag:['일상의 안심을 여는 기술','Opening the door to everyday peace of mind'],lead:['10년 이상, 모든 브랜드 아파트 출입카드를 제작·판매해 온 스마일보안시스템. 매일 사용하는 작은 키에 편리함과 신뢰를 담습니다.','For over 10 years, Smile Security System has produced and supplied apartment access cards across brands, bringing convenience and trust to the keys used every day.'],headline:['작은 출입카드 하나에도,<br>오랜 경험을 담습니다.','A decade of experience.<br>In every access card.'],body:['고리형 세대키부터 원형 스티커형, 신용카드형까지. 사용 환경과 선호에 맞춰 아파트 출입카드 제작을 상담해 드립니다. 자이·래미안·푸르지오·호반·롯데캐슬을 비롯한 다양한 브랜드의 디자인을 만나보세요.','From loop key tags to circular stickers and credit-card-shaped cards, explore formats that suit your daily routine. View design examples for Xi, Raemian, Prugio, Hoban, Lotte Castle and more.'],badges:[['10년 이상 제작·판매','모든 아파트 브랜드 상담','3가지 제품 형태'],['Over 10 years','All apartment brands','Three product formats']],services:[[['고리형 세대키','가방이나 열쇠에 걸어 휴대하는 형태로, 일상에서 간편하게 꺼내 사용할 수 있습니다.'],['원형 스티커형','원형 스티커 형태의 출입카드입니다. 부착할 위치와 사용 환경에 맞춰 제작을 상담해 드립니다.'],['신용카드형','지갑이나 카드지갑에 보관하기 좋은 익숙한 카드 형태입니다. 브랜드별 디자인으로 제작합니다.']],[['Loop key tags','A portable format designed to hang from keys or a bag for convenient daily use.'],['Circular stickers','A circular sticker format. Discuss suitable placement and use conditions when ordering.'],['Card format','A familiar credit-card-shaped format for carrying in a wallet, available with apartment-brand designs.']]],note:['출입 시스템·주파수·등록 방식에 따라 사용 가능 여부가 달라질 수 있으므로 제작 전 확인해 주세요. 이미지의 브랜드별 디자인은 제작 예시입니다.','Compatibility depends on the access system, frequency and registration method. Please confirm before production. Brand designs shown are examples.']},
{id:'ai',name:['ARTHUS AI 연구소','ARTHUS AI Lab'],category:['APPLIED INTELLIGENCE','APPLIED INTELLIGENCE'],tag:['연구를 넘어, 현장에서 쓰이는 AI','AI that moves from research into practice'],lead:['에스테틱 현장에서 사용하는 AI 피부 분석 앱을 바탕으로, 뷰티와 인공지능을 연결하는 앱 개발을 이어갑니다.','Building on an AI skin-analysis app currently used in aesthetic practices, we develop applications that connect beauty with artificial intelligence.'],headline:['현장의 경험이,<br>AI의 다음 가능성이 됩니다.','Practice inspires<br>the next possibility of AI.'],body:['ARTHUS AI 연구소는 AI 앱 개발과 피부 진단기 개발을 추진하며, 피부 분석 앱을 에스테틱에서 상용화하고 있습니다. 림프마사지 AI 앱과 화장품 유효성검사 앱 개발로 연구 영역을 넓혀가고 있습니다.','ARTHUS AI Lab works on AI applications and skin-analysis systems. Our skin-analysis app is in commercial use in aesthetic practices, alongside development work on a lymphatic-massage AI app and a cosmetics efficacy-evaluation app.'],badges:[['피부 분석 앱 상용화 중','에스테틱 현장 활용','뷰티 AI 앱 개발'],['Skin app in commercial use','Used in aesthetic practices','Beauty AI development']],services:[[['AI 피부 분석 · 피부 진단기','현재 에스테틱에서 상용화 중인 피부 분석 앱과 피부 진단기 개발을 통해, 뷰티 현장과 AI 기술의 접점을 만듭니다.','피부 분석 앱 상용화 중'],['림프마사지 AI 앱','림프마사지 분야와 인공지능을 연결하는 앱을 개발하며, 에스테틱 현장에 적용할 수 있는 활용 방향을 연구합니다.','개발 사업'],['화장품 유효성검사 앱','화장품 유효성검사 분야의 앱 개발을 추진합니다. 뷰티 분야의 전문 경험을 디지털 서비스로 확장합니다.','개발 사업']],[['AI skin analysis','A skin-analysis app in commercial use in aesthetic practices, alongside development of skin-analysis systems.','Skin app in commercial use'],['Lymphatic-massage AI app','Developing an AI app for the lymphatic-massage field and exploring its applications in aesthetic practice.','In development'],['Cosmetics efficacy-evaluation app','Application development for cosmetics efficacy evaluation, extending beauty expertise into digital services.','In development']]]},
{id:'realestate',name:['믿음부동산','Mideum Real Estate'],category:['REAL ESTATE & CONSULTING','REAL ESTATE & CONSULTING'],tag:['20년의 경험, 신뢰로 이어지는 선택','Twenty years of experience. A foundation of trust.'],lead:['20년 전통의 부동산 중개 경험을 바탕으로 토지개발, 시행사 협력, 도시개발과 컨설팅까지 함께하는 믿음부동산입니다.','With a 20-year tradition in real estate brokerage, Mideum extends its services to land development, developer collaboration, urban development and consulting.'],headline:['공간의 가치를 읽고,<br>사업의 방향을 함께 찾습니다.','Understanding places.<br>Shaping possibilities.'],body:['부동산은 한 번의 거래를 넘어 삶과 사업의 중요한 결정입니다. 믿음부동산은 축적된 중개 경험과 현장에 대한 이해를 바탕으로, 고객의 목적에 맞는 부동산 상담과 개발 사업 컨설팅을 제공합니다.','A property decision shapes both life and business. Drawing on brokerage experience and an understanding of the field, Mideum provides real estate guidance and development consulting aligned with each client’s goals.'],badges:[['20년 전통','부동산 중개','개발 · 컨설팅'],['20-year tradition','Property brokerage','Development & consulting']],services:[[['부동산 중개','주거와 사업 공간을 위한 부동산 중개. 고객의 이용 목적과 조건을 듣고 신뢰를 바탕으로 거래를 돕습니다.'],['토지개발 · 시행사 협력','토지개발과 시행사 협력 업무를 통해 사업의 가능성과 추진 방향을 함께 검토합니다.'],['도시개발 · 컨설팅','도시개발을 비롯한 부동산 사업을 상담하고, 중개에서 사업 검토와 컨설팅까지 함께합니다.']],[['Property brokerage','Brokerage for living and business spaces, guided by the client’s intended use and requirements.'],['Land & developer collaboration','Land-development and developer-collaboration services to explore project possibilities and direction.'],['Urban development & consulting','Consultation on real estate projects, from brokerage to urban development and project planning.']]],address:['경기 부천시 소사구 소사로247번길 24','24, Sosa-ro 247beon-gil, Sosa-gu, Bucheon-si, Gyeonggi-do'],officePhone:'032-341-2203',map:'https://map.naver.com/p/entry/place/1891725723'},
{id:'academy',name:['루미나래 뷰티 아카데미','LUMINARAE Beauty Academy'],category:['BEAUTY EDUCATION','BEAUTY EDUCATION'],tag:['배움이 실력이 되고, 실력이 미래가 되는 곳','Where learning becomes skill, and skill opens a future'],lead:['피부미용·메이크업·네일아트·반영구 교육과 중국 강의 경험을 바탕으로, 뷰티 전문가의 배움과 성장을 함께합니다.','Supporting beauty professionals through skincare, makeup, nail-art and permanent-makeup education, informed by teaching experience extending to China.'],headline:['뷰티의 기본부터,<br>전문가의 깊이까지.','From beauty foundations<br>to professional depth.'],body:['루미나래 뷰티 아카데미는 이론과 실무를 연결하는 교육을 지향합니다. 피부미용, 메이크업, 네일아트, 반영구를 폭넓게 가르치며, 중국에서도 강의를 진행한 경험을 교육에 담습니다. 별도의 온라인 교육 사이트로 학습 자료를 이어서 확인할 수 있습니다.','LUMINARAE Beauty Academy connects theory with practical learning across skincare, makeup, nail art and permanent makeup. Teaching experience in China enriches our educational perspective. A separate online learning site provides access to educational materials.'],badges:[['4개 뷰티 교육 분야','중국 강의 경험','온라인 교육 사이트 운영'],['Four beauty disciplines','Teaching experience in China','Online learning site']],services:[[['피부미용','피부미용의 이론과 관리 실무를 연결하며, 전문적인 뷰티 서비스를 위한 기초를 다집니다.'],['메이크업 · 네일아트','메이크업과 네일아트의 기초부터 표현 실습까지, 분야별 전문성을 키우는 교육을 진행합니다.'],['반영구','반영구 분야의 이론과 실무 교육을 진행합니다. 세부 과정과 수강 일정은 개별 상담으로 안내합니다.']],[['Skincare','Connecting skincare theory with practical care techniques to build professional foundations.'],['Makeup & nail art','Education that develops expertise in makeup and nail art through foundations and practical expression.'],['Permanent makeup','Theory and practical education in permanent makeup. Ask us about available courses and schedules.']]],external:'https://narae0930.github.io/inchen-Learning-material/'},
{id:'esthetic',name:['루미나래 에스테틱','LUMINARAE Esthetic'],category:['AESTHETIC CARE','AESTHETIC CARE'],tag:['30년의 섬세함에, AI의 가능성을 더하다','Thirty years of care. A new perspective through AI.'],lead:['30년 전통의 에스테틱 경험과 최첨단 시설, AI 피부 분석 시스템을 바탕으로 나를 위한 섬세한 관리 시간을 제안합니다.','A 30-year tradition of aesthetic care, advanced facilities and an AI skin-analysis system come together for a considered, personal care experience.'],headline:['피부를 이해하는 시간,<br>나를 위한 아름다움.','Time to understand your skin.<br>Beauty, considered personally.'],body:['루미나래 에스테틱은 오랜 관리 경험에 AI 피부 분석 시스템을 접목합니다. 피부 상태를 살펴보는 상담과 편안한 관리 공간을 통해, 고객 한 분 한 분을 위한 세심한 에스테틱 서비스를 지향합니다.','LUMINARAE Esthetic brings extensive care experience together with AI skin analysis. Through skin consultations and a comfortable care environment, we focus on attentive aesthetic services for each individual.'],badges:[['30년 전통','최첨단 시설','AI 피부 분석 시스템'],['30-year tradition','Advanced facilities','AI skin-analysis system']],services:[[['AI 피부 분석','AI 피부 분석 시스템으로 피부 상태를 살펴보고, 상담에 참고할 수 있는 정보를 함께 확인합니다.'],['경험을 담은 피부 관리','30년의 에스테틱 경험을 바탕으로 피부 고민을 듣고 개인에게 맞는 관리 방향을 상담합니다.'],['편안한 관리 환경','최첨단 시설과 편안한 분위기 속에서 일상에 여유를 더하는 에스테틱 경험을 제공합니다.']],[['AI skin analysis','Using AI skin analysis to review skin condition and provide information to support a care consultation.'],['Experienced aesthetic care','Drawing on 30 years of experience to listen to skin concerns and discuss a suitable care direction.'],['A comfortable care setting','Advanced facilities and a calm atmosphere create space for an attentive aesthetic experience.']]]}

let lang='ko';try{lang=localStorage.getItem('arthus-language')==='en'?'en':'ko'}catch{}
const el=id=>document.getElementById(id), t=()=>UI[lang], ix=()=>lang==='ko'?0:1, text=v=>v[ix()], phone='010-8449-1489';
const image=(key,alt,cls='')=>`<img src="${ASSETS[key]}" alt="${alt}" class="${cls}" loading="lazy">`;
function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function hiddenToday(){try{return localStorage.getItem('arthus-hide-promo')===day()}catch{return false}}
function companyCards(){return `<div class="company-grid">${COMPANIES.map(c=>`<a class="company-card" href="#${c.id}" aria-label="${text(c.name)}">${image(c.id,text(c.name))}<span class="card-label"><span>${text(c.name)}</span><span class="arrow" aria-hidden="true">↗</span></span></a>`).join('')}</div>`}
function cta(){return `<section class="cta"><div><h2>${t().talk}</h2><p>${t().talkText}</p></div><a class="pill" href="tel:+821084491489">${t().call} &nbsp; ${phone} ↗</a></section>`}
function home(){return `<section class="hero" style="--hero:url('${ASSETS.hero}')"><div class="hero-copy"><p class="eyebrow">ARTHUS</p><h1>${t().title}</h1><p class="hero-sub">${t().sub}</p><a class="pill" href="#about">${t().explore}<span aria-hidden="true">↗</span></a></div><aside class="promo" id="promo" aria-label="${t().popupTitle}" ${hiddenToday()?'hidden':''}><button class="promo-close" id="close-promo" aria-label="${t().close}">×</button><p class="eyebrow">${t().popupLabel}</p><h2>${t().popupTitle}</h2><button class="catalog-open" data-catalog aria-label="${t().catalog}">${image('catalog',t().catalog)}</button><a href="#security" class="pill solid">${t().product} ↗</a><div class="promo-bottom"><a class="promo-phone" href="tel:+821084491489">${t().representative}<span>${phone}</span></a><label class="hide-promo"><input id="hide-today" type="checkbox">${t().today}</label></div></aside></section><section class="collection"><div class="collection-heading"><div><p class="eyebrow">ABOUT ARTHUS</p><h2>${t().companies}</h2></div><span class="collection-line"></span><div class="mascot">${image('robot','ARTHUS 화이트 골드 로봇 캐릭터')}<p>${t().tomorrow}</p></div></div>${companyCards()}<div class="intro-line"><span>${t().intro}</span><a href="#contact">${t().inquire} &nbsp;↗</a></div></section>`}
function top(title,lead,category='ARTHUS'){return `<div class="page-top"><p class="breadcrumb"><a href="#home">${t().home}</a> &nbsp; / &nbsp; ${title}</p><p class="eyebrow">${category}</p><h1>${title}</h1><p class="lead">${lead}</p></div>`}
function detail(c){return `<div class="wrap">${top(text(c.name),text(c.lead),text(c.category))}<section class="detail-feature"><figure style="margin:0">${image(c.id,text(c.name),'detail-image')}${c.id==='security'?'':`<figcaption class="image-note">${t().sample}</figcaption>`}</figure><div class="detail-copy"><p class="eyebrow">${text(c.tag)}</p><h2>${text(c.headline)}</h2><p>${text(c.body)}</p><div class="badges">${text(c.badges).map(b=>`<span class="badge">${b}</span>`).join('')}</div><a class="text-link" href="#contact">${t().inquire} ↗</a></div></section><section class="section"><p class="eyebrow">EXPERTISE</p><h2>${t().services}</h2><div class="services">${c.services[ix()].map((s,n)=>`<article class="service"><span class="number">0${n+1}</span><h3>${s[0]}</h3><p>${s[1]}</p>${s[2]?`<span class="status">${s[2]}</span>`:''}</article>`).join('')}</div></section>${c.id==='security'?securityExtra(c):''}${c.id==='academy'?academyExtra(c):''}${c.id==='realestate'?realestateExtra(c):''}${cta()}<p style="margin-bottom:50px"><a class="text-link" href="#about">← ${t().back}</a></p></div>`}
function securityExtra(c){const steps=lang==='ko'?[['상담','아파트 브랜드와 필요한 제품 형태를 알려주세요.'],['시스템 확인','기존 카드의 규격과 등록 방식 등 호환 조건을 확인합니다.'],['디자인 · 제작','수량과 디자인을 협의한 뒤 제작을 진행합니다.'],['수령 · 등록','제품을 수령하고 해당 아파트의 등록 절차에 따라 이용합니다.']]:[['Consult','Tell us the apartment brand and product format.'],['Check compatibility','Confirm system specifications and registration requirements.'],['Design & production','Agree on the quantity and design before production.'],['Delivery & registration','Receive the products and follow your apartment’s registration process.']];return `<section class="section"><p class="eyebrow">PRODUCT COLLECTION</p><h2>${t().catalog}</h2><p class="contact-note">${t().catalogNote}</p><button class="catalog-open wide-catalog" data-catalog>${image('catalog',t().catalog)}</button><p class="contact-note">${text(c.note)}</p></section><section class="section"><h2>${lang==='ko'?'제작 상담부터 사용까지':'From enquiry to everyday use'}</h2><div class="steps">${steps.map((s,n)=>`<article class="step"><b>0${n+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div></section>`}
function academyExtra(c){return `<section class="section"><p class="eyebrow">LEARNING CONTINUES</p><h2>${lang==='ko'?'강의실 밖에서도 이어지는 배움':'Continue learning beyond the classroom'}</h2><p class="lead">${lang==='ko'?'기존 루미나래 온라인 교육 사이트에서 학습을 이어가세요. 교육 과정과 수강 상담은 대표 연락처로 문의해 주세요.':'Continue your studies through LUMINARAE’s existing online learning site. Contact us to discuss courses and enrolment.'}</p><a class="pill solid" href="${c.external}" target="_blank" rel="noopener noreferrer">${t().learning} ↗</a><p class="contact-note">${t().loginNote}</p></section>`}
function realestateExtra(c){return `<section class="section"><p class="eyebrow">VISIT & CONTACT</p><h2>${lang==='ko'?'믿음공인중개사사무소 안내':'Mideum Real Estate office'}</h2><p>${text(c.address)}</p><p><a class="text-link" href="tel:+82323412203">${c.officePhone}</a></p><a class="pill" href="${c.map}" target="_blank" rel="noopener noreferrer">${lang==='ko'?'네이버지도에서 보기':'View on Naver Map'} ↗</a></section>`}
function about(isBusiness=false){return `<div class="wrap">${top(isBusiness?t().all:t().nav[0],lang==='ko'?'보안, 인공지능, 부동산, 뷰티. 다섯 분야의 전문성을 하나의 이름으로 연결합니다.':'Security, AI, real estate and beauty. Five specialist businesses, connected by one name.','ABOUT ARTHUS')}<div class="about-statement">${lang==='ko'?'일상을 지키는 기술에서<br>아름다움을 가꾸는 경험까지.':'From technology that protects everyday life<br>to experiences that nurture beauty.'}</div><div class="about-list">${COMPANIES.map(c=>`<article class="about-row"><a href="#${c.id}" tabindex="-1">${image(c.id,text(c.name))}</a><div><p class="eyebrow">${text(c.category)}</p><h2><a href="#${c.id}">${text(c.name)}</a></h2><p>${text(c.lead)}</p><a href="#${c.id}" class="text-link">${lang==='ko'?'자세히 보기':'Explore'} ↗</a></div></article>`).join('')}</div><p class="illustration-label">${t().sample}</p>${cta()}</div>`}
function sustainability(){const list=lang==='ko'?[['오래 쌓은 신뢰','보안 10년 이상, 부동산 20년, 에스테틱 30년의 경험을 바탕으로 고객과 오래 이어지는 관계를 지향합니다.'],['현장과 연결되는 기술','AI 연구소와 에스테틱의 접점에서, 실제 현장에 적용할 수 있는 기술과 서비스의 가능성을 탐색합니다.'],['사람을 키우는 교육','뷰티 교육과 강의 경험을 통해 전문성을 나누고, 배움이 다음 기회로 이어질 수 있도록 함께합니다.']]:[['Lasting trust','Experience spanning over 10 years in security, 20 in real estate and 30 in aesthetic care informs a commitment to lasting relationships.'],['Technology in practice','At the intersection of AI research and aesthetic practice, we explore technologies and services that can be used in the field.'],['Education that supports people','Through beauty education and teaching, we share expertise and support learning that opens new opportunities.']];return `<div class="wrap">${top(t().nav[2],lang==='ko'?'오래 이어갈 가치를 생각합니다. 신뢰, 기술, 교육을 중심으로 ARTHUS가 지향하는 방향입니다.':'Values for the long term. Trust, technology and education guide the direction of ARTHUS.','OUR DIRECTION')}<section class="section"><div class="services">${list.map((v,n)=>`<article class="service"><span class="number">0${n+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div></section>${cta()}</div>`}
function news(){return `<div class="wrap">${top(t().nav[3],lang==='ko'?'ARTHUS의 사업과 교육, 기술 개발 소식을 전합니다.':'Updates on our businesses, education and technology development.','NEWSROOM')}<article class="empty-news"><p class="eyebrow">BUSINESS OVERVIEW</p><h2>${lang==='ko'?'ARTHUS의 현재 사업을 만나보세요':'Explore our businesses today'}</h2><p>${lang==='ko'?'출입카드 제작·판매, AI 앱 개발, 부동산 중개·컨설팅, 뷰티 교육과 에스테틱까지. 각 계열사 소개에서 현재 사업을 확인하실 수 있습니다.':'Explore access-card production, AI application development, real estate, beauty education and aesthetic care through our company pages.'}</p><a href="#business" class="text-link">${t().all} ↗</a></article><p class="contact-note">${lang==='ko'?'새로운 소식은 준비되는 대로 이곳에 안내하겠습니다.':'New announcements will be shared here as they become available.'}</p>${cta()}</div>`}
function contact(){return `<div class="wrap">${top(t().nav[4],t().talkText,'CONTACT ARTHUS')}<section class="contact-panel"><div><p class="eyebrow">${t().representative}</p><p class="contact-number"><a href="tel:+821084491489">${phone}</a></p><div class="contact-items"><a href="tel:+821084491489" class="pill solid">${t().call} ↗</a><button class="pill" id="copy-phone" style="background:transparent">${t().copy}</button></div></div><div><p class="eyebrow">BUSINESS ENQUIRY</p>${COMPANIES.map(c=>`<p style="margin:0;padding:9px 0;border-bottom:1px solid var(--line)"><a href="#${c.id}">${text(c.name)} &nbsp;↗</a></p>`).join('')}</div></section><section class="section"><h2>${lang==='ko'?'문의 전 확인해 주세요':'Before you enquire'}</h2><details><summary>${lang==='ko'?'출입카드 제작 상담에는 무엇이 필요한가요?':'What information helps with an access-card enquiry?'}</summary><p>${lang==='ko'?'아파트명, 필요한 제품 형태, 수량과 기존 출입 시스템 정보를 알려주시면 상담에 도움이 됩니다. 호환 여부와 등록 방식은 제작 전에 확인합니다.':'Tell us the apartment name, product format, quantity and available information about the existing access system. Compatibility and registration requirements are checked before production.'}</p></details><details><summary>${lang==='ko'?'교육 과정과 에스테틱 상담은 어떻게 하나요?':'How do I ask about courses or aesthetic care?'}</summary><p>${lang==='ko'?'대표 연락처로 관심 있는 분야를 말씀해 주세요. 과정, 일정과 관리 상담을 안내해 드립니다.':'Call our representative and let us know your area of interest. We will guide you on courses, schedules and care consultations.'}</p></details><details><summary>${lang==='ko'?'AI 개발이나 부동산 사업 협력도 문의할 수 있나요?':'Can I enquire about AI or real estate collaboration?'}</summary><p>${lang==='ko'?'가능합니다. 추진 중인 사업의 목적과 협력하고 싶은 내용을 알려주시면 관련 분야를 중심으로 상담합니다.':'Yes. Tell us about your project’s goals and the collaboration you have in mind so we can discuss the relevant business area.'}</p></details></section></div>`}
let firstRender=true;
function render(){const route=location.hash.slice(1)||'home',navRoutes=['about','business','sustainability','news','contact'];const c=COMPANIES.find(c=>c.id===route);document.documentElement.lang=lang;document.body.classList.toggle('inner',route!=='home');document.title=`ARTHUS | ${c?text(c.name):route==='home'?(lang==='ko'?'평범함, 그 너머로':'Beyond the ordinary'):t().nav[navRoutes.indexOf(route)]||'ARTHUS'}`;el('navigation').innerHTML=navRoutes.map((r,n)=>`<a href="#${r}" class="${route===r?'active':''}">${t().nav[n]}</a>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});el('menu').textContent=lang==='ko'?'메뉴':'Menu';el('menu').setAttribute('aria-expanded','false');el('navigation').classList.remove('open');el('main').innerHTML=c?detail(c):route==='about'?about():route==='business'?about(true):route==='sustainability'?sustainability():route==='news'?news():route==='contact'?contact():home();el('footer').innerHTML=`<a href="#home" class="wordmark">ARTHUS</a><div class="footer-links"><a href="#about">${t().nav[0]}</a><a href="#security">${lang==='ko'?'출입카드 제품':'Access cards'}</a><a href="#contact">${t().representative} ${phone}</a></div><span>© ${new Date().getFullYear()} ARTHUS. All rights reserved.</span>`;el('catalog-large').src=ASSETS.catalog;el('catalog-title').textContent=t().popupTitle;el('catalog-caption').textContent=lang==='ko'?'브랜드별 디자인 예시 · 실제 제작 시 디자인 및 규격 확인':'Brand design examples · Confirm designs and specifications before production';el('close-dialog').setAttribute('aria-label',t().close);if(!firstRender){window.scrollTo({top:0,behavior:'instant'});const heading=el('main').querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}firstRender=false}
window.addEventListener('hashchange',render);document.addEventListener('click',async e=>{const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;try{localStorage.setItem('arthus-language',lang)}catch{}render()}if(e.target.closest('#menu')){const expanded=el('menu').getAttribute('aria-expanded')==='true';el('menu').setAttribute('aria-expanded',String(!expanded));el('navigation').classList.toggle('open',!expanded)}if(e.target.closest('#close-promo')){if(el('hide-today')?.checked){try{localStorage.setItem('arthus-hide-promo',day())}catch{}}el('promo').hidden=true}if(e.target.closest('[data-catalog]'))el('catalog-dialog').showModal();if(e.target.closest('#close-dialog'))el('catalog-dialog').close();if(e.target.closest('#copy-phone')){try{await navigator.clipboard.writeText(phone);showToast(t().copied)}catch{showToast(t().copyFail)}}});el('catalog-dialog').addEventListener('click',e=>{if(e.target===el('catalog-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){el('navigation').classList.remove('open');el('menu').setAttribute('aria-expanded','false')}});function showToast(s){el('toast').textContent=s;el('toast').hidden=false;setTimeout(()=>el('toast').hidden=true,3000)}render();
</script></body></html>
