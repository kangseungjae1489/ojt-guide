{id:'ai',name:['MENTORS AI 연구소','MENTORS AI Lab'],category:['APPLIED INTELLIGENCE','APPLIED INTELLIGENCE'],tag:['연구를 넘어, 현장에서 쓰이는 AI','AI that moves from research into practice'],lead:['에스테틱 현장에서 사용하는 AI 피부 분석 앱을 바탕으로, 뷰티와 인공지능을 연결하는 앱 개발을 이어갑니다.','Building on an AI skin-analysis app currently used in aesthetic practices, we develop applications that connect beauty with artificial intelligence.'],headline:['현장의 경험이,<br>AI의 다음 가능성이 됩니다.','Practice inspires<br>the next possibility of AI.'],body:['MENTORS AI 연구소는 AI 앱 개발과 피부 진단기 개발을 추진하며, 피부 분석 앱을 에스테틱에서 상용화하고 있습니다. 림프마사지 AI 앱과 화장품 유효성검사 앱 개발로 연구 영역을 넓혀가고 있습니다.','MENTORS AI Lab works on AI applications and skin-analysis systems. Our skin-analysis app is in commercial use in aesthetic practices, alongside development work on a lymphatic-massage AI app and a cosmetics efficacy-evaluation app.'],badges:[['피부 분석 앱 상용화 중','에스테틱 현장 활용','뷰티 AI 앱 개발'],['Skin app in commercial use','Used in aesthetic practices','Beauty AI development']],services:[[['AI 피부 분석 · 피부 진단기','현재 에스테틱에서 상용화 중인 피부 분석 앱과 피부 진단기 개발을 통해, 뷰티 현장과 AI 기술의 접점을 만듭니다.','피부 분석 앱 상용화 중'],['림프마사지 AI 앱','림프마사지 분야와 인공지능을 연결하는 앱을 개발하며, 에스테틱 현장에 적용할 수 있는 활용 방향을 연구합니다.','개발 사업'],['화장품 유효성검사 앱','화장품 유효성검사 분야의 앱 개발을 추진합니다. 뷰티 분야의 전문 경험을 디지털 서비스로 확장합니다.','개발 사업']],[['AI skin analysis','A skin-analysis app in commercial use in aesthetic practices, alongside development of skin-analysis systems.','Skin app in commercial use'],['Lymphatic-massage AI app','Developing an AI app for the lymphatic-massage field and exploring its applications in aesthetic practice.','In development'],['Cosmetics efficacy-evaluation app','Application development for cosmetics efficacy evaluation, extending beauty expertise into digital services.','In development']]]},

let lang='ko';try{lang=localStorage.getItem('arthus-language')==='en'?'en':'ko'}catch{}
const el=id=>document.getElementById(id), t=()=>UI[lang], ix=()=>lang==='ko'?0:1, text=v=>v[ix()], phone='010-8449-1489';
const image=(key,alt,cls='')=>`<img src="${ASSETS[key]}" alt="${alt}" class="${cls}" loading="lazy">`;
function day(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function hiddenToday(){try{return localStorage.getItem('arthus-hide-promo')===day()}catch{return false}}
function companyCards(){return `<div class="company-grid">${COMPANIES.map(c=>`<a class="company-card" href="#${c.id}" aria-label="${text(c.name)}">${image(c.id,text(c.name))}<span class="card-label"><span>${text(c.name)}</span><span class="arrow" aria-hidden="true">↗</span></span></a>`).join('')}</div>`}
function cta(){return `<section class="cta"><div class="cta-concierge">${image('robot','MENTORS 브랜드 캐릭터','concierge-robot')}<div><h2>${t().talk}</h2><p>${t().talkText}</p></div></div><a class="pill" href="tel:+821084491489">${t().call} &nbsp; ${phone} ↗</a></section>`}
function home(){return `<section class="hero" style="--hero:url('${ASSETS.hero}')"><div class="hero-copy"><p class="eyebrow">MENTORS</p><h1>${t().title}</h1><p class="hero-sub">${t().sub}</p><a class="pill" href="#about">${t().explore}<span aria-hidden="true">↗</span></a><button id="music-toggle" class="music-control" aria-pressed="false"><span class="music-icon" aria-hidden="true">♫</span><span id="music-label">${lang==='ko'?'배경음악 켜기':'Play background music'}</span></button></div><aside class="promo" id="promo" aria-label="${t().popupTitle}" ${hiddenToday()?'hidden':''}><button class="promo-close" id="close-promo" aria-label="${t().close}">×</button><p class="eyebrow">${t().popupLabel}</p><h2>${t().popupTitle}</h2><button class="catalog-open" data-catalog aria-label="${t().catalog}">${image('catalog',t().catalog)}</button><a href="#security" class="pill solid">${t().product} ↗</a><div class="promo-bottom"><a class="promo-phone" href="tel:+821084491489">${t().representative}<span>${phone}</span></a><label class="hide-promo"><input id="hide-today" type="checkbox">${t().today}</label></div></aside></section><section class="collection"><div class="collection-heading"><div><p class="eyebrow">ABOUT MENTORS</p><h2>${t().companies}</h2></div><span class="collection-line"></span><div class="mascot">${image('robot','MENTORS 화이트 골드 로봇 캐릭터')}<p>${t().tomorrow}</p></div></div>${companyCards()}<div class="intro-line"><span>${t().intro}</span><a href="#contact">${t().inquire} &nbsp;↗</a></div></section>`}
function pageHeading(title,lead,category='MENTORS'){return `<div class="page-top"><p class="breadcrumb"><a href="#home">${t().home}</a> &nbsp; / &nbsp; ${title}</p><p class="eyebrow">${category}</p><h1>${title}</h1><p class="lead">${lead}</p></div>`}
function detail(c){return `<div class="wrap">${pageHeading(text(c.name),text(c.lead),text(c.category))}<section class="detail-feature"><figure style="margin:0">${image(c.id==='security'?'security-access':c.id,text(c.name),'detail-image')}<figcaption class="image-note">${t().sample}</figcaption></figure><div class="detail-copy"><p class="eyebrow">${text(c.tag)}</p><h2>${text(c.headline)}</h2><p>${text(c.body)}</p><div class="badges">${text(c.badges).map(b=>`<span class="badge">${b}</span>`).join('')}</div><a class="text-link" href="#contact">${t().inquire} ↗</a></div></section><section class="section"><p class="eyebrow">EXPERTISE</p><h2>${t().services}</h2><div class="services">${c.services[ix()].map((s,n)=>`<article class="service"><span class="number">0${n+1}</span><h3>${s[0]}</h3><p>${s[1]}</p>${s[2]?`<span class="status">${s[2]}</span>`:''}</article>`).join('')}</div></section>${c.id==='security'?securityExtra(c):companyStory(c)}${c.id==='academy'?academyExtra(c):''}${c.id==='realestate'?realestateExtra(c):''}${cta()}<p style="margin-bottom:50px"><a class="text-link" href="#about">← ${t().back}</a></p></div>`}

function companyStory(c){const copy={ai:[['기술과 현장이 만나는 곳','피부 분석 앱의 현장 활용을 바탕으로 림프마사지 AI 앱과 화장품 유효성검사 앱 개발을 이어갑니다.'],['Where technology meets practice','Building on skin-analysis app use in aesthetic practice, our development work extends to lymphatic-massage AI and cosmetics efficacy-evaluation apps.']],realestate:[['거래에서 개발의 가능성까지','20년의 중개 경험을 바탕으로 토지개발, 시행사 협력과 도시개발 컨설팅을 함께합니다.'],['From property to project possibilities','Twenty years of brokerage experience informs our land-development, developer-collaboration and urban-development consulting.']],academy:[['배움의 깊이를 더하는 강의실','피부미용, 메이크업, 네일아트, 반영구. 중국 강의 경험과 함께 이론과 실무를 연결하는 뷰티 교육을 지향합니다.'],['A classroom for professional growth','Skincare, makeup, nail art and permanent makeup. Our education connects theory with practice, informed by teaching experience in China.']],esthetic:[['오랜 경험, 더 섬세한 관리','30년의 에스테틱 경험과 AI 피부 분석 시스템을 바탕으로 고객의 피부 고민을 듣고 관리 방향을 상담합니다.'],['Experienced care, thoughtfully personal','Thirty years of aesthetic experience and AI skin analysis inform attentive consultations about skin concerns and care direction.']]};const v=copy[c.id][ix()];return `<section class="section"><div class="detail-feature" style="padding-bottom:0"><div class="detail-copy"><p class="eyebrow">THE MENTORS EXPERIENCE</p><h2>${v[0]}</h2><p>${v[1]}</p><a href="#contact" class="text-link">${t().inquire} ↗</a></div><figure style="margin:0">${image(c.id+'-story',text(c.name),'detail-image')}<figcaption class="image-note">${t().sample}</figcaption></figure></div></section>`}

function securityExtra(c){const steps=lang==='ko'?[['상담','아파트 브랜드와 필요한 제품 형태를 알려주세요.'],['시스템 확인','기존 카드의 규격과 등록 방식 등 호환 조건을 확인합니다.'],['디자인 · 제작','수량과 디자인을 협의한 뒤 제작을 진행합니다.'],['수령 · 등록','제품을 수령하고 해당 아파트의 등록 절차에 따라 이용합니다.']]:[['Consult','Tell us the apartment brand and product format.'],['Check compatibility','Confirm system specifications and registration requirements.'],['Design & production','Agree on the quantity and design before production.'],['Delivery & registration','Receive the products and follow your apartment’s registration process.']];return `<section class="section"><div class="detail-feature" style="padding-bottom:0"><div class="detail-copy"><p class="eyebrow">SMART ACCESS</p><h2>${lang==='ko'?'출입카드로 완성하는<br>일상의 편리함.':'Everyday convenience.<br>Three ways to carry it.'}</h2><p>${lang==='ko'?'고리형 세대키, 원형 스티커형, 신용카드형. 사용 환경과 휴대 방식에 맞는 형태를 선택하세요. 10년 이상의 제작·판매 경험을 바탕으로 아파트 브랜드와 출입 시스템에 맞는 제품 상담을 도와드립니다.':'Choose from loop key tags, circular stickers and credit-card-shaped cards to suit your routine. More than a decade of production and supply experience informs each product consultation.'}</p><a href="#contact" class="text-link">${t().inquire} ↗</a></div><figure style="margin:0">${image('security-products',lang==='ko'?'고리형 세대키, 원형 스티커형, 신용카드형 출입카드 연출 이미지':'Illustration of three access-card formats','detail-image')}<figcaption class="image-note">${t().sample}</figcaption></figure></div></section><section class="section"><p class="eyebrow">PRODUCT COLLECTION</p><h2>${t().catalog}</h2><p class="contact-note">${t().catalogNote}</p><button class="catalog-open wide-catalog" data-catalog>${image('catalog',t().catalog)}</button><p class="contact-note">${text(c.note)}</p></section><section class="section"><h2>${lang==='ko'?'제작 상담부터 사용까지':'From enquiry to everyday use'}</h2><div class="steps">${steps.map((s,n)=>`<article class="step"><b>0${n+1}</b><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div></section>`}
function academyExtra(c){return `<section class="section"><p class="eyebrow">LEARNING CONTINUES</p><h2>${lang==='ko'?'강의실 밖에서도 이어지는 배움':'Continue learning beyond the classroom'}</h2><p class="lead">${lang==='ko'?'기존 루미나래 온라인 교육 사이트에서 학습을 이어가세요. 교육 과정과 수강 상담은 대표 연락처로 문의해 주세요.':'Continue your studies through LUMINARAE’s existing online learning site. Contact us to discuss courses and enrolment.'}</p><a class="pill solid" href="${c.external}" target="_blank" rel="noopener noreferrer">${t().learning} ↗</a><p class="contact-note">${t().loginNote}</p></section>`}
function realestateExtra(c){return `<section class="section"><p class="eyebrow">VISIT & CONTACT</p><h2>${lang==='ko'?'믿음공인중개사사무소 안내':'Mideum Real Estate office'}</h2><p>${text(c.address)}</p><p><a class="text-link" href="tel:+82323412203">${c.officePhone}</a></p><a class="pill" href="${c.map}" target="_blank" rel="noopener noreferrer">${lang==='ko'?'네이버지도에서 보기':'View on Naver Map'} ↗</a></section>`}
function about(isBusiness=false){return `<div class="wrap">${pageHeading(isBusiness?t().all:t().nav[0],lang==='ko'?'보안, 인공지능, 부동산, 뷰티. 다섯 분야의 전문성을 하나의 이름으로 연결합니다.':'Security, AI, real estate and beauty. Five specialist businesses, connected by one name.','ABOUT MENTORS')}<div class="about-brand-intro">${image('robot','MENTORS 브랜드 캐릭터','about-robot')}<div class="about-statement">${lang==='ko'?'일상을 지키는 기술에서<br>아름다움을 가꾸는 경험까지.':'From technology that protects everyday life<br>to experiences that nurture beauty.'}</div></div><div class="about-list">${COMPANIES.map(c=>`<article class="about-row"><a href="#${c.id}" tabindex="-1">${image(c.id,text(c.name))}</a><div><p class="eyebrow">${text(c.category)}</p><h2><a href="#${c.id}">${text(c.name)}</a></h2><p>${text(c.lead)}</p><a href="#${c.id}" class="text-link">${lang==='ko'?'자세히 보기':'Explore'} ↗</a></div></article>`).join('')}</div><p class="illustration-label">${t().sample}</p>${cta()}</div>`}
function sustainability(){const list=lang==='ko'?[['오래 쌓은 신뢰','보안 10년 이상, 부동산 20년, 에스테틱 30년의 경험을 바탕으로 고객과 오래 이어지는 관계를 지향합니다.'],['현장과 연결되는 기술','AI 연구소와 에스테틱의 접점에서, 실제 현장에 적용할 수 있는 기술과 서비스의 가능성을 탐색합니다.'],['사람을 키우는 교육','뷰티 교육과 강의 경험을 통해 전문성을 나누고, 배움이 다음 기회로 이어질 수 있도록 함께합니다.']]:[['Lasting trust','Experience spanning over 10 years in security, 20 in real estate and 30 in aesthetic care informs a commitment to lasting relationships.'],['Technology in practice','At the intersection of AI research and aesthetic practice, we explore technologies and services that can be used in the field.'],['Education that supports people','Through beauty education and teaching, we share expertise and support learning that opens new opportunities.']];return `<div class="wrap">${pageHeading(t().nav[2],lang==='ko'?'오래 이어갈 가치를 생각합니다. 신뢰, 기술, 교육을 중심으로 MENTORS가 지향하는 방향입니다.':'Values for the long term. Trust, technology and education guide the direction of MENTORS.','OUR DIRECTION')}<section class="section"><div class="services">${list.map((v,n)=>`<article class="service"><span class="number">0${n+1}</span><h3>${v[0]}</h3><p>${v[1]}</p></article>`).join('')}</div></section>${cta()}</div>`}
function news(){return `<div class="wrap">${pageHeading(t().nav[3],lang==='ko'?'MENTORS의 사업과 교육, 기술 개발 소식을 전합니다.':'Updates on our businesses, education and technology development.','NEWSROOM')}<article class="empty-news"><p class="eyebrow">BUSINESS OVERVIEW</p><h2>${lang==='ko'?'MENTORS의 현재 사업을 만나보세요':'Explore our businesses today'}</h2><p>${lang==='ko'?'출입카드 제작·판매, AI 앱 개발, 부동산 중개·컨설팅, 뷰티 교육과 에스테틱까지. 각 계열사 소개에서 현재 사업을 확인하실 수 있습니다.':'Explore access-card production, AI application development, real estate, beauty education and aesthetic care through our company pages.'}</p><a href="#business" class="text-link">${t().all} ↗</a></article><p class="contact-note">${lang==='ko'?'새로운 소식은 준비되는 대로 이곳에 안내하겠습니다.':'New announcements will be shared here as they become available.'}</p>${cta()}</div>`}
function contact(){return `<div class="wrap">${pageHeading(t().nav[4],t().talkText,'CONTACT MENTORS')}<section class="contact-panel"><div><p class="eyebrow">${t().representative}</p><p class="contact-number"><a href="tel:+821084491489">${phone}</a></p><div class="contact-items"><a href="tel:+821084491489" class="pill solid">${t().call} ↗</a><button class="pill" id="copy-phone" style="background:transparent">${t().copy}</button></div></div><div><p class="eyebrow">BUSINESS ENQUIRY</p>${COMPANIES.map(c=>`<p style="margin:0;padding:9px 0;border-bottom:1px solid var(--line)"><a href="#${c.id}">${text(c.name)} &nbsp;↗</a></p>`).join('')}</div></section><section class="section"><h2>${lang==='ko'?'문의 전 확인해 주세요':'Before you enquire'}</h2><details><summary>${lang==='ko'?'출입카드 제작 상담에는 무엇이 필요한가요?':'What information helps with an access-card enquiry?'}</summary><p>${lang==='ko'?'아파트명, 필요한 제품 형태, 수량과 기존 출입 시스템 정보를 알려주시면 상담에 도움이 됩니다. 호환 여부와 등록 방식은 제작 전에 확인합니다.':'Tell us the apartment name, product format, quantity and available information about the existing access system. Compatibility and registration requirements are checked before production.'}</p></details><details><summary>${lang==='ko'?'교육 과정과 에스테틱 상담은 어떻게 하나요?':'How do I ask about courses or aesthetic care?'}</summary><p>${lang==='ko'?'대표 연락처로 관심 있는 분야를 말씀해 주세요. 과정, 일정과 관리 상담을 안내해 드립니다.':'Call our representative and let us know your area of interest. We will guide you on courses, schedules and care consultations.'}</p></details><details><summary>${lang==='ko'?'AI 개발이나 부동산 사업 협력도 문의할 수 있나요?':'Can I enquire about AI or real estate collaboration?'}</summary><p>${lang==='ko'?'가능합니다. 추진 중인 사업의 목적과 협력하고 싶은 내용을 알려주시면 관련 분야를 중심으로 상담합니다.':'Yes. Tell us about your project’s goals and the collaboration you have in mind so we can discuss the relevant business area.'}</p></details></section></div>`}

let musicWanted=true;
function isHomeRoute(){return !location.hash||location.hash==='#home'}
function updateMusicControl(){const btn=el('music-toggle'),label=el('music-label'),audio=el('home-music');if(!btn||!label)return;const playing=!audio.paused;btn.setAttribute('aria-pressed',String(playing));label.textContent=lang==='ko'?(playing?'배경음악 끄기':'배경음악 켜기'):(playing?'Pause background music':'Play background music')}
function playHomeMusic(){const audio=el('home-music');if(!isHomeRoute()||!musicWanted)return;audio.volume=0.22;try{const pending=audio.play();if(pending&&pending.then)pending.then(()=>{if(!isHomeRoute()||!musicWanted){audio.pause();if(!isHomeRoute())audio.currentTime=0}updateMusicControl()}).catch(updateMusicControl)}catch{updateMusicControl()}}
function syncHomeMusic(){const audio=el('home-music');if(!isHomeRoute()){audio.pause();audio.currentTime=0}else if(musicWanted)playHomeMusic();updateMusicControl()}
el('home-music').addEventListener('play',updateMusicControl);el('home-music').addEventListener('pause',updateMusicControl);
document.addEventListener('pointerdown',e=>{if(isHomeRoute()&&musicWanted&&!e.target.closest('#music-toggle'))playHomeMusic()},{passive:true});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&isHomeRoute()&&musicWanted&&!e.target.closest('#music-toggle'))playHomeMusic()});

let firstRender=true;
function render(){const route=location.hash.slice(1)||'home',navRoutes=['about','business','sustainability','news','contact'];const c=COMPANIES.find(c=>c.id===route);document.documentElement.lang=lang;document.body.classList.toggle('inner',route!=='home');document.title=`MENTORS | ${c?text(c.name):route==='home'?(lang==='ko'?'생각을 현실로':'Ideas into reality'):t().nav[navRoutes.indexOf(route)]||'MENTORS'}`;el('navigation').innerHTML=navRoutes.map((r,n)=>`<a href="#${r}" class="${route===r?'active':''}">${t().nav[n]}</a>`).join('')+`<a class="resource-link" href="https://arthuss.netlify.app/" target="_blank" rel="noopener noreferrer" aria-label="${lang==='ko'?'자료실 (새 창)':'Resources (new tab)'}">${lang==='ko'?'자료실':'Resources'} <span aria-hidden="true">↗</span></a>`;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',b.dataset.lang===lang)});el('menu').textContent=lang==='ko'?'메뉴':'Menu';el('menu').setAttribute('aria-expanded','false');el('navigation').classList.remove('open');el('main').innerHTML=c?detail(c):route==='about'?about():route==='business'?about(true):route==='sustainability'?sustainability():route==='news'?news():route==='contact'?contact():home();el('footer').innerHTML=`<a href="#home" class="wordmark">MENTORS</a><div class="footer-links"><a href="#about">${t().nav[0]}</a><a href="#security">${lang==='ko'?'출입카드 제품':'Access cards'}</a><a href="#contact">${t().representative} ${phone}</a></div><span>© ${new Date().getFullYear()} MENTORS. All rights reserved.</span>`;el('catalog-large').src=ASSETS.catalog;el('catalog-title').textContent=t().popupTitle;el('catalog-caption').textContent=lang==='ko'?'브랜드별 디자인 예시 · 실제 제작 시 디자인 및 규격 확인':'Brand design examples · Confirm designs and specifications before production';el('close-dialog').setAttribute('aria-label',t().close);if(!firstRender){window.scrollTo({top:0,behavior:'instant'});const heading=el('main').querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}}firstRender=false;syncHomeMusic()}
window.addEventListener('hashchange',render);document.addEventListener('click',async e=>{if(e.target.closest('#music-toggle')){const audio=el('home-music');if(audio.paused){musicWanted=true;playHomeMusic()}else{musicWanted=false;audio.pause()}updateMusicControl();return}const l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;try{localStorage.setItem('arthus-language',lang)}catch{}render()}if(e.target.closest('#menu')){const expanded=el('menu').getAttribute('aria-expanded')==='true';el('menu').setAttribute('aria-expanded',String(!expanded));el('navigation').classList.toggle('open',!expanded)}if(e.target.closest('#close-promo')){if(el('hide-today')?.checked){try{localStorage.setItem('arthus-hide-promo',day())}catch{}}el('promo').hidden=true}if(e.target.closest('[data-catalog]'))el('catalog-dialog').showModal();if(e.target.closest('#close-dialog'))el('catalog-dialog').close();if(e.target.closest('#copy-phone')){try{await navigator.clipboard.writeText(phone);showToast(t().copied)}catch{showToast(t().copyFail)}}});el('catalog-dialog').addEventListener('click',e=>{if(e.target===el('catalog-dialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){el('navigation').classList.remove('open');el('menu').setAttribute('aria-expanded','false')}});function showToast(s){el('toast').textContent=s;el('toast').hidden=false;setTimeout(()=>el('toast').hidden=true,3000)}try{render()}catch(error){console.error("MENTORS initialization failed",error)}
</script></body></html>
